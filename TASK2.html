<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Personal Information:</legend>

            <label for="fullname"> Full Name:</label>
            <input type="text" id="fullname" name="fullname" required minlength="2">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
             
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" 
            pattern="05[0-9]-[0-9]{7}"
            placeholder="052-1212121">
        </fieldset>

        <fieldset>
            <legend>Ticket & Workshops</legend>
            <label for="ticketype">Ticket type:</label>
            <select name="ticketype" id="ticketype" required>
                <option value="standard">Standard</option>
                <option value="vip">VIP</option>
                <option value="student">Student</option>
            </select>
            <br>

            <p>Workshops:</p>
            <input type="checkbox" id="WebPerformance" name="Workshops" value="WebPerformance">
            <label for="WebPerformance"> Web Performance</label>

            <input type="checkbox" id="accessibility" name="Workshops" value="accessibility">
            <label for="accessibility"> Accessibility</label>

            <input type="checkbox" id="testing" name="Workshops" value="testing">
            <label for="testing"> Testing</label>


            <br>

            <p>Diet:</p>
            <input type="radio" name="diet" id="none" value="none">
            <label for="none"> None</label>
            <input type="radio" name="diet" id="vegan" value="vegan">
            <label for="vegan">Vegan</label>
            <input type="radio" name="diet" id="kosher" value="kosher">
            <label for="kosher">Kosher</label>
            <input type="radio" name="diet" id="halal" value="halal">
            <label for="halal">Halal</label>
            <input type="radio" name="diet" id="other" value="other">
            <label for="other">Other</label>
        </fieldset>

        <fieldset>
            <legend> Payment Details:</legend>
            <label for="cardNumber">Card number</label>
            <input type="text" name="cardNumber" id="cardNumber" pattern="^([0-9]\s*){13,19}$">

            <label for="expiry">Expiry Date:</label>
            <input type="month" name="expiry" id="expiry" min="2026-10">

            <label for="cvv">CVV </label>
            <input type="password" name="cvv" id="cvv" pattern="[0-9]{3,4}">


        </fieldset>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
